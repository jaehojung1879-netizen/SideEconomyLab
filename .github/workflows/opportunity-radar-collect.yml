name: Opportunity Radar official collection
# Server-side only: existing SEOUL secret, sanitized outputs, fail-closed publication.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe = geography/service evidence; collect = validated radar bundle'
        type: choice
        options: [collect, probe]
        default: collect
  push:
    branches: [claude/opportunity-radar-v2-trends-37xua1]
    paths: ['config/opportunity-radar-run.json']
permissions:
  contents: write
concurrency:
  group: radar-collect-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve mode
        id: mode
        run: |
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then MODE='${{ inputs.mode }}'; else MODE=$(python -c "import json;print(json.load(open('config/opportunity-radar-run.json'))['mode'])"); fi
          case "$MODE" in probe|collect) ;; *) echo 'invalid mode'; exit 1;; esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
      - name: Probe official geography evidence
        if: steps.mode.outputs.mode == 'probe'
        env:
          SEOUL: ${{ secrets.SEOUL }}
          DATA_GO: ${{ secrets.DATA_GO }}
          R_ONE: ${{ secrets.R_ONE }}
        run: python pipeline/radar_geography_probe.py --out research/opportunity-radar-v2/geography-probe.json
      - name: Collect and validate radar bundle
        if: steps.mode.outputs.mode == 'collect'
        env:
          SEOUL: ${{ secrets.SEOUL }}
        run: |
          python pipeline/opportunity_radar.py
          python pipeline/opportunity_radar.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opportunity-radar-${{ steps.mode.outputs.mode }}
          path: |
            research/opportunity-radar-v2
            data/opportunity-radar
            docs/data/opportunity-radar.json
            docs/data/opportunity-radar-status.json
            docs/data/opportunity-radar-details
          if-no-files-found: warn
          retention-days: 14
      - name: Commit sanitized result if the branch is unchanged
        if: success()
        run: |
          BEFORE=$(git rev-parse HEAD)
          git fetch origin "${{ github.ref_name }}"
          test "$BEFORE" = "$(git rev-parse FETCH_HEAD)" || { echo 'Upstream changed; artifact only.'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for p in research/opportunity-radar-v2 data/opportunity-radar docs/data/opportunity-radar.json docs/data/opportunity-radar-status.json docs/data/opportunity-radar-details docs/data/opportunity-radar-v2; do
            if [ -e "$p" ]; then git add -A "$p"; fi
          done
          git diff --cached --quiet && exit 0
          git commit -m 'data: Opportunity Radar ${{ steps.mode.outputs.mode }} from official Seoul sources'
          git push origin HEAD:${{ github.ref_name }}

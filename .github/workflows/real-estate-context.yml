name: Refresh audited real-estate context
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: real-estate-context-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh pinned official sources without credentials
        run: python pipeline/real_estate_context.py --refresh
      - name: Commit only a complete validated replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/real-estate-context docs/data/real-estate-context.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh audited real-estate context"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Refresh audited real-estate context
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: seoul-derived-data-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install integrity test dependencies
        run: python -m pip install pyproj==3.7.2 jsonschema==4.26.0
      - name: Refresh pinned official sources without credentials
        run: python pipeline/real_estate_context.py --refresh
      - name: Revalidate dependencies and portfolio provenance
        run: python pipeline/gis_refresh.py --rebuild-only
      - name: Commit only a complete validated replacement
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" || {
            echo "Remote changed during refresh; rerun from the new input snapshot."
            exit 1
          }
          python pipeline/gis_refresh.py --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/real-estate-context docs/data/real-estate-context.json docs/data/candidate-validation-portfolio.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh audited real-estate context"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Verify decision intelligence
on:
  push:
    branches: [main]
    paths: ['docs/**', 'pipeline/**', 'data/decision-intelligence/**', 'research/**', 'tests/**', '.github/workflows/**']
  pull_request:
    paths: ['docs/**', 'pipeline/**', 'data/decision-intelligence/**', 'research/**', 'tests/**', '.github/workflows/**']
permissions:
  contents: read
concurrency:
  group: decision-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned verification dependencies
        run: |
          python -m pip install pyproj==3.7.2 jsonschema==4.26.0
          npm install --prefix /tmp/decision-test playwright@1.58.2 leaflet@1.9.4 proj4@2.11.0
          /tmp/decision-test/node_modules/.bin/playwright install --with-deps chromium
      - name: Source safety, deterministic decisions and preserved integrity
        run: |
          python pipeline/decision_bundle.py
          python -m unittest discover -s tests -v
          node tests/decision-models.cjs
          node tests/workbench-models.cjs
          node tests/real-estate-context.cjs
          python pipeline/gis_refresh.py --check
          python pipeline/validation_portfolio.py --check
      - name: Decision view, hover behavior, private sites and mobile
        env:
          NODE_PATH: /tmp/decision-test/node_modules
        run: |
          mkdir -p /tmp/decision-static
          ln -s "$GITHUB_WORKSPACE/docs" /tmp/decision-static/SideEconomyLab
          python -m http.server 8765 --bind 127.0.0.1 --directory /tmp/decision-static > /tmp/decision-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8765/SideEconomyLab/index.html > /dev/null; then break; fi
            sleep 0.2
          done
          node tests/decision-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decision-intelligence-screenshots
          path: /tmp/decision-browser
          if-no-files-found: ignore

name: Refresh decision intelligence evidence
on:
  workflow_dispatch:
  push:
    branches: [feat/decision-intelligence-v1]
    paths: ['pipeline/public_api_client.py', 'pipeline/decision_sources.py', '.github/workflows/decision-source-refresh.yml']
permissions:
  contents: write
concurrency:
  group: decision-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit authenticated official operations with the exact secret contract
        env:
          DATA_GO: ${{ secrets.DATA_GO }}
          R_ONE: ${{ secrets.R_ONE }}
        run: python pipeline/decision_sources.py --probe --output /tmp/decision-source-audit
      - uses: actions/upload-artifact@v4
        with:
          name: sanitized-decision-source-audit
          path: /tmp/decision-source-audit
          retention-days: 3
      - name: Preserve sanitized audit for review
        run: |
          mkdir -p data/decision-intelligence
          cp /tmp/decision-source-audit/probe.json data/decision-intelligence/source-audit.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/decision-intelligence/source-audit.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: preserve sanitized decision source audit'
          git push origin HEAD:${{ github.ref_name }}

name: Publish browser map configuration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/browser_map_config.py'
      - '.github/workflows/browser-map-config.yml'
permissions:
  contents: write
  pages: write
concurrency:
  group: browser-map-config-main
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare intended public JavaScript key only
        env:
          KAKAO_JAVASCRIPT_KEY: ${{ secrets.KAKAO_JAVASCRIPT_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_DEFAULT_ADMIN_KEY: ${{ secrets.KAKAO_DEFAULT_ADMIN_KEY }}
          KAKAO_DEFAULT_NATIVE_KEY: ${{ secrets.KAKAO_DEFAULT_NATIVE_KEY }}
          SEOUL: ${{ secrets.SEOUL }}
        run: python pipeline/browser_map_config.py
      - name: Commit browser config if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/map-runtime.json
          if git diff --cached --quiet; then exit 0; fi
          # Do not print a diff: the browser app key is intentionally public,
          # but credential values should still never appear in job logs.
          git commit -m 'config: publish browser map settings'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Request build from existing main/docs Pages source
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.request('POST /repos/{owner}/{repo}/pages/builds', {
                owner: context.repo.owner, repo: context.repo.repo
              });
              core.info('Pages build requested for the existing source');
            } catch (error) {
              core.setFailed('Pages build request failed; verify Pages write permission and main/docs source. HTTP ' + (error.status || 'unknown'));
            }

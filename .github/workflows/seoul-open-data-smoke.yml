name: Seoul Open Data API smoke

on:
  push:
    branches:
      - data/seoul-open-data-api-v1
  workflow_dispatch:
    inputs:
      radar_history:
        description: 'Collect bounded sales/store history for Opportunity Radar (artifact only)'
        type: boolean
        default: false
      radar_probe:
        description: 'Probe official geography/service evidence for Opportunity Radar v2 (artifact only)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ inputs.radar_history != true && inputs.radar_probe != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate SEOUL repository secret
        shell: bash
        env:
          SEOUL: ${{ secrets.SEOUL }}
        run: |
          if [ -z "$SEOUL" ]; then
            echo "::error::Repository secret SEOUL is missing or empty."
            exit 1
          fi

      - name: Call Seoul workplace-population API
        env:
          SEOUL: ${{ secrets.SEOUL }}
        run: |
          python pipeline/seoul_open_data_smoke.py             --service VwsmSignguWrcPopltnW             --start 1             --end 5             --out artifacts/seoul-open-data-smoke.json

      - name: Upload sanitized smoke-test result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: seoul-open-data-smoke
          path: artifacts/seoul-open-data-smoke.json
          if-no-files-found: error
          retention-days: 7

  radar-probe:
    if: ${{ inputs.radar_probe == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe official geography evidence with existing server secrets
        env:
          SEOUL: ${{ secrets.SEOUL }}
          DATA_GO: ${{ secrets.DATA_GO }}
          R_ONE: ${{ secrets.R_ONE }}
        run: python pipeline/radar_geography_probe.py --out artifacts/radar-geography-probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-geography-probe
          path: artifacts/radar-geography-probe.json
          if-no-files-found: warn
          retention-days: 14

  radar-history:
    if: ${{ inputs.radar_history == true && inputs.radar_probe != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and validate bounded history with existing server secret
        env:
          SEOUL: ${{ secrets.SEOUL }}
        run: python pipeline/opportunity_radar.py
      - name: Verify reproducible source bundle
        if: success()
        run: python pipeline/opportunity_radar.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opportunity-radar-collection
          path: |
            data/opportunity-radar
            docs/data/opportunity-radar.json
            docs/data/opportunity-radar-status.json
            docs/data/opportunity-radar-details
          if-no-files-found: error
          retention-days: 14

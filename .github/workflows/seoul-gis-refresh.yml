name: Refresh Seoul opportunity GIS

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * 0"
  push:
    branches:
      - main
      - feat/sideeconomy-gis-v1
    paths:
      - pipeline/seoul_location_screen.py
      - pipeline/kakao_competitor_layer.py
      - docs/gis.html
      - docs/assets/gis.js
      - docs/assets/gis.css
      - .github/workflows/seoul-gis-refresh.yml

permissions:
  contents: write

concurrency:
  group: seoul-opportunity-gis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2

      - name: Decide demand refresh
        id: refresh
        shell: bash
        run: |
          NEED=false
          if [ ! -f docs/data/seoul-opportunity-map.json ]; then
            NEED=true
          elif [ "${{ github.event_name }}" != "push" ]; then
            NEED=true
          elif git diff --name-only HEAD^ HEAD | grep -q '^pipeline/seoul_location_screen.py$'; then
            NEED=true
          fi
          echo "demand=${NEED}" >> "$GITHUB_OUTPUT"
          echo "Demand refresh: ${NEED}"

      - name: Install GIS dependency
        run: python -m pip install --disable-pip-version-check pyproj==3.7.2

      - name: Build public Seoul demand-fit dataset
        if: steps.refresh.outputs.demand == 'true'
        env:
          SEOUL: ${{ secrets.SEOUL }}
          GIS_OUTPUT: docs/data/seoul-opportunity-map.json
        run: python -u pipeline/seoul_location_screen.py

      - name: Build Kakao competition / substitute layer
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_POI_TOP_N: "15"
          KAKAO_POI_RADIUS_M: "800"
        run: python -u pipeline/kakao_competitor_layer.py

      - name: Commit refreshed GIS datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/seoul-opportunity-map.json docs/data/kakao-poi-layer.json
          if git diff --cached --quiet; then
            echo "No GIS data changes to commit"
            exit 0
          fi
          git commit -m "data: refresh Seoul opportunity GIS"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
